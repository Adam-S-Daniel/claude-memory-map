name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `test` is meant to be a REQUIRED status check on main (cms-platform#437) —
# keep it a plain job id with no `name:`, no matrix, no `concurrency` group,
# and no `timeout-minutes`, and keep it present on every pull request to main.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Verify action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/gh-actions-lock"
          mkdir -p "$ext"
          gh release download v0.2.0 -R github/gh-actions-lock -p linux-amd64 -O "$ext/gh-actions-lock"
          echo "79ec84c191667fd935a277e6fd3662cf5d3669cccc9e99998731d8f306f373b6  $ext/gh-actions-lock" | sha256sum -c -
          chmod +x "$ext/gh-actions-lock"
          (cd "$ext" && gh extension install .)
          rc=0
          out=$(gh actions-lock --verify --no-interactive --json=valid,findings) || rc=$?
          # v0.2.0 exits 0 with a reachability-unknown finding when the API fails; fail on any finding
          # except cooldown-config-ignored, which reports dependabot.yml's cooldown exclude, not a pin.
          if [[ "$rc" -ne 0 ]] || ! jq -e '.valid == true and ([.findings[] | select(.category != "cooldown-config-ignored")] | length) == 0' <<<"$out" >/dev/null; then
            # Escape %, CR and LF so finding text cannot start a new workflow command.
            if jq -e 'type == "object"' <<<"$out" >/dev/null 2>&1; then
              jq -r 'def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"); .findings[]? | select(.category != "cooldown-config-ignored") | "::error::actions.lock \(.category | esc): \(.dependency // .workflow // "-" | esc): \(.detail | esc)"' <<<"$out"
            else
              echo '::error::gh actions-lock --verify returned no readable JSON.'
            fi
            if jq -e 'any(.findings[]?; .category == "reachability-unknown")' <<<"$out" >/dev/null 2>&1; then
              echo '::error::reachability-unknown means the GitHub API was unreachable; re-run once it is back.'
            fi
            echo "::error::gh actions-lock --verify failed (exit $rc)."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      # GitHub validates .github/dependabot.yml only once it is on main (the
      # `dependabot` check never runs on a PR), so an invalid key merged green
      # and silently disabled every Dependabot update for five weeks (#31).
      # This is the pre-merge guard.
      - name: Check .github/dependabot.yml
        run: npm run test:config

      # Executes dependabot-auto-merge.yml's sweep script for real, against a
      # stubbed `gh` — a schedule-only workflow gets no PR-time run otherwise.
      - name: Check dependabot-auto-merge.yml
        run: npm run test:workflows

      - name: Check generated Mermaid suite
        run: npm run test:suite

      - name: Install Chrome for Testing
        run: npm run setup:browser

      - name: Build index.html
        run: npm run build

      # The committed index.html must BE the build output. The site-sync /
      # site-preview workflows copy the committed file to adamdaniel.ai, so
      # this check is what makes that copy the verified build artifact.
      - name: Verify committed index.html matches the build
        run: |
          if ! git diff --exit-code -- index.html; then
            echo "::error::index.html is stale — run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Run e2e test suite
        run: npm test
